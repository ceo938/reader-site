<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>커뮤베스트</title>
<meta name="description" content="커뮤니티 베스트 글, 일간지 부동산 뉴스, 해외 테크 기사를 20분마다 모아 한 화면에서 읽는다.">
<script>
// ── 애드센스: 승인 뒤 구글이 주는 값을 여기 붙여 넣는다. 비어 있으면 광고 칸이 아예 안 그려진다.
//   client   : "ca-pub-0000000000000000"  (애드센스 → 계정 → 게시자 ID)
//   slot_top : "0000000000"               (목록 위 광고 단위, 디스플레이 가로형)
//   slot_feed: "0000000000"               (목록 사이 광고 단위, 인피드 또는 디스플레이)
//   every    : 몇 글마다 목록 사이 광고를 끼울지
var AD = { client: "", slot_top: "", slot_feed: "", every: 12 };
</script>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="커뮤베스트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1b1b1b">
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--fg:#1b1b1b;--muted:#6b6b6b;--line:#e4e2dd;--accent:#0f6fff;--new:#ff5a1f;--chip:#ecebe6;--chip-on:#1b1b1b;--chip-on-fg:#fff;--read:#9a9a9a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#121212;--card:#1c1c1c;--fg:#ececec;--muted:#9a9a9a;--line:#2a2a2a;--accent:#6ea8ff;--new:#ff7a45;--chip:#262626;--chip-on:#ececec;--chip-on-fg:#121212;--read:#666;
}}
:root[data-theme=dark]{--bg:#121212;--card:#1c1c1c;--fg:#ececec;--muted:#9a9a9a;--line:#2a2a2a;--accent:#6ea8ff;--new:#ff7a45;--chip:#262626;--chip-on:#ececec;--chip-on-fg:#121212;--read:#666;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 0 0}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;max-width:860px;margin:0 auto}
.top h1{font-size:18px;margin:0;font-weight:700}
.top .when{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tabs{display:flex;max-width:860px;margin:0 auto;padding:0 8px}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:8px 4px 10px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--fg);border-color:var(--fg)}
.tabs button .n{font-size:11px;color:var(--new);margin-left:3px;font-weight:700}
.tools{max-width:860px;margin:0 auto;padding:8px 16px 0;display:flex;gap:8px;align-items:center}
.tools input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}
.tools button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chips{max-width:860px;margin:0 auto;padding:8px 16px 4px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--fg);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--chip-on);color:var(--chip-on-fg)}
main{max-width:860px;margin:0 auto;padding:6px 16px 60px}
.item{display:block;padding:11px 0;border-bottom:1px solid var(--line)}
.item .t{font-size:16px;font-weight:600;line-height:1.35}
.item.read .t{color:var(--read);font-weight:500}
.item.dropped .t{opacity:.6}
.item .o{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.3}
.item .m{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center}
.item .m .src{font-weight:600;color:var(--fg)}
.item.read .m .src{color:var(--muted)}
.item .s{font-size:13.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.new{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--new);flex:none}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.err{font-size:12px;color:var(--muted);padding:8px 0}
.sep{font-size:12px;color:var(--muted);padding:14px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.ad{display:block;margin:14px 0;min-height:0}
.ad ins.adsbygoogle{display:block;width:100%}
footer{max-width:860px;margin:0 auto;padding:24px 16px 40px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
footer a{text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="top"><h1>커뮤베스트</h1><span class="when" id="when">불러오는 중</span></div>
  <div class="tabs" id="tabs">
    <button data-sec="community">커뮤니티<span class="n"></span></button>
    <button data-sec="realestate">부동산<span class="n"></span></button>
    <button data-sec="tech">테크<span class="n"></span></button>
    <button data-sec="world">해외<span class="n"></span></button>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="제목 검색" autocomplete="off">
    <button id="markall" title="지금 보이는 글을 모두 읽음으로">모두 읽음</button>
    <button id="theme" title="밝게/어둡게">◐</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="ad" id="adtop"></div>
<main id="list"></main>
<footer>
  <span>커뮤베스트 · 제목과 링크만 모으고 본문은 원문 사이트에서 읽습니다.</span>
  <a href="privacy.html">개인정보처리방침</a>
</footer>
<script>
// ── 광고: AD.client 가 채워져 있을 때만 그린다 ──
let adLoaded=false;
function adUnit(slot){return `<ins class="adsbygoogle" data-ad-client="${AD.client}" data-ad-slot="${slot}" data-ad-format="auto" data-full-width-responsive="true"></ins>`}
function adScript(){
  if(adLoaded||!AD.client)return;adLoaded=true;
  const s=document.createElement('script');s.async=true;s.crossOrigin='anonymous';
  s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+AD.client;document.head.appendChild(s);
}
function adPush(){if(!AD.client)return;document.querySelectorAll('ins.adsbygoogle:not([data-adsbygoogle-status])').forEach(()=>{try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}})}
if(AD.client&&AD.slot_top){adScript();document.getElementById('adtop').innerHTML=adUnit(AD.slot_top)}
</script>
<script>
const $=s=>document.querySelector(s);
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
let data=null, sec=LS('sec')||'community', off=LS('off')||{}, read=new Set(LS('read')||[]), lastVisit=LS('lastVisit')||'', q='';
const visitStart=new Date().toISOString();
if(LS('theme'))document.documentElement.dataset.theme=LS('theme');

function rel(iso){if(!iso)return'';const d=(Date.now()-new Date(iso))/6e4;if(d<1)return'방금';if(d<60)return Math.floor(d)+'분 전';if(d<1440)return Math.floor(d/60)+'시간 전';return Math.floor(d/1440)+'일 전'}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// 같은 수집 시각에 들어온 글은 소스를 번갈아 섞는다(한 곳 글이 줄줄이 뭉치지 않게)
function interleave(items){
  const out=[];let i=0;
  while(i<items.length){
    const k=items[i].first_seen;const grp=[];
    while(i<items.length&&items[i].first_seen===k)grp.push(items[i++]);
    const by={};for(const it of grp)(by[it.source]=by[it.source]||[]).push(it);
    const qs=Object.values(by);let more=true;
    while(more){more=false;for(const qq of qs){if(qq.length){out.push(qq.shift());more=true}}}
  }
  return out;
}
function isNew(it){return lastVisit&&it.first_seen>lastVisit&&!read.has(it.id)}

function render(){
  if(!data)return;
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.classList.toggle('on',b.dataset.sec===sec);
    const n=(data.items[b.dataset.sec]||[]).filter(isNew).length;
    b.querySelector('.n').textContent=n?'+'+n:'';
  });
  const srcs=data.sources[sec]||[]; const o=off[sec]||{};
  $('#chips').innerHTML=srcs.map(s=>`<button class="chip ${o[s]?'':'on'}" data-s="${esc(s)}">${esc(s)}</button>`).join('');
  let items=(data.items[sec]||[]).filter(it=>!o[it.source]);
  if(q)items=items.filter(it=>(it.title+' '+(it.summary||'')).toLowerCase().includes(q));
  if(sec==='community')items=interleave(items);
  const errs=Object.entries(data.errors||{}).filter(([s])=>srcs.includes(s));
  let h=errs.length?`<div class="err">받지 못한 곳: ${errs.map(e=>esc(e[0])).join(', ')} (이전 목록 유지)</div>`:'';
  if(!items.length)h+='<div class="empty">없음</div>';
  let lastDay='',n=0;
  for(const it of items){
    if(AD.client&&AD.slot_feed&&n&&n%AD.every===0)h+=`<div class="ad">${adUnit(AD.slot_feed)}</div>`;
    n++;
    const day=(it.time||it.first_seen||'').slice(0,10);
    if(sec!=='community'&&day&&day!==lastDay){lastDay=day;const dd=new Date(day);h+=`<div class="sep">${dd.getMonth()+1}월 ${dd.getDate()}일</div>`}
    const href=TR.includes(sec)&&it.source!=='Hacker News'?'read.html?u='+encodeURIComponent(it.url):it.url;
    h+=`<a class="item ${read.has(it.id)?'read':''} ${it.dropped?'dropped':''}" href="${esc(href)}" rel="noopener" data-id="${it.id}">
      <div class="t">${esc(it.ko_title||it.title)}</div>
      ${it.ko_title?`<div class="o">${esc(it.title)}</div>`:''}
      ${(it.ko_summary||it.summary)?`<div class="s">${esc(it.ko_summary||it.summary)}</div>`:''}
      <div class="m">${isNew(it)?'<span class="new"></span>':''}<span class="src">${esc(it.source)}</span><span>${rel(it.time||it.first_seen)}</span>${it.dropped?'<span>베스트에서 내려감</span>':''}</div></a>`;
  }
  $('#list').innerHTML=h;
  $('#when').textContent='갱신 '+rel(data.generated);
  adScript();adPush();
}

// 영문 섹션(테크·해외) 제목·요약 번역: 아직 번역 안 된 새 글만 12건씩 서버에 묻고, 올 때마다 바로 그린다
const TR=['tech','world'];
let translating=false;
async function translateTitles(){
  if(!data||translating)return;
  translating=true;
  try{
    for(let round=0;round<12;round++){
      const secs=[sec,...TR.filter(s=>s!==sec)].filter(s=>TR.includes(s));
      const todo=[];
      for(const s of secs)for(const it of data.items[s]||[])if(!it.ko_title&&!it._tried&&it.source!=='Hacker News'&&todo.length<12)todo.push(it);
      if(!todo.length)break;
      const r=await fetch('/api/titles',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({items:todo.map(it=>({id:it.id,title:it.title,summary:(it.summary||'').slice(0,200)}))})});
      const d=await r.json();
      for(const it of todo)it._tried=true;
      if(!d.result)break;
      for(const s of TR)for(const it of data.items[s]||[]){const v=d.result[it.id];if(v){it.ko_title=v.ko_title;it.ko_summary=v.ko_summary}}
      render();
    }
  }catch(e){}
  translating=false;
}
async function load(){
  try{
    // 수집 결과는 깃허브에 20분마다 커밋된다. 거기서 바로 읽고, 안 되면 배포된 사본을 쓴다.
    let r=await fetch('https://raw.githubusercontent.com/ceo938/reader-site/main/public/data/items.json?'+Date.now(),{cache:'no-store'}).catch(()=>null);
    if(!r||!r.ok)r=await fetch('data/items.json?'+Date.now(),{cache:'no-store'});
    // 새로 받은 목록에 이전에 받아 둔 번역을 옮겨 붙인다
    const prev={};if(data)for(const s of TR)for(const it of data.items[s]||[])if(it.ko_title)prev[it.id]=it;
    data=await r.json();
    for(const s of TR)for(const it of data.items[s]||[]){const p=prev[it.id];if(p){it.ko_title=p.ko_title;it.ko_summary=p.ko_summary}}
    render();
    translateTitles();
  }catch(e){$('#when').textContent='불러오기 실패'}
}

$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;sec=b.dataset.sec;LS('sec',sec);render();window.scrollTo(0,0)};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;off[sec]=off[sec]||{};off[sec][b.dataset.s]=!off[sec][b.dataset.s];LS('off',off);render()};
$('#list').addEventListener('click',e=>{const a=e.target.closest('.item');if(!a)return;read.add(a.dataset.id);LS('read',[...read].slice(-3000));a.classList.add('read');a.querySelector('.new')?.remove()});
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
$('#markall').onclick=()=>{document.querySelectorAll('#list .item').forEach(a=>read.add(a.dataset.id));LS('read',[...read].slice(-3000));render()};
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;LS('theme',nx)};

load();
setInterval(load,2*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
// 다음 방문 때 "새 글" 표시 기준은 이번 방문 시작 시각
addEventListener('pagehide',()=>LS('lastVisit',visitStart));
</script>
</body>
</html>
