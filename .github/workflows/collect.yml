name: 읽을거리 수집 (20분마다)

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q feedparser beautifulsoup4 requests lxml
      - name: 수집 → public/data/items.json
        run: python3 collector/collect.py
      - name: 결과 저장(자동 배포 트리거)
        run: |
          git config user.name  "reader-collector"
          git config user.email "actions@github.com"
          git add public/data collector/state.json
          if git diff --cached --quiet; then echo "변화 없음"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%m-%d %H:%M') 수집"
          git pull --rebase -q || true
          git push
